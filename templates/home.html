{% extends 'base.html' %}
{% block content %}
<body>

                <img src="{{ url_for('static', filename='images/leo.png') }}" class="img-fluid  w-100" style="height:50vh " alt="Hero Image">
            </div>
        </div>   
        <div class="row g-4 mt-2 mb-5">

                <p class="text-muted small flex-grow-1">{{ t.maelezo }}</p>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="fw-bold text-primary fs-5">TZS {{ t.bei }}</span>
                    <a href="#" class="btn btn-primary btn-sm px-3">Angalia</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
        </div>
    </div>

</html>
