<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>business Base Template</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #0d5fdb;
      --brand-dark: #0a47a8;
      --ink: #16202b;
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--ink);
    }

    /* ---------- Navbar ---------- */
    .navbar {
      padding-top: .85rem;
      padding-bottom: .85rem;
    }

    .navbar-brand {
      font-size: 1.35rem;
      letter-spacing: .06em;
    }

    .navbar-nav .nav-link {
      position: relative;
      font-weight: 500;
      color: var(--ink);
      padding: .5rem .9rem !important;
      transition: color .2s ease;
    }

    .navbar-nav .nav-link:hover {
      color: var(--brand);
    }

    .navbar-nav .nav-link.active {
      color: var(--brand);
      font-weight: 600;
    }

    .navbar-nav .nav-link.active::after {
      content: "";
      position: absolute;
      left: .9rem;
      right: .9rem;
      bottom: 0;
      height: 2px;
      background: var(--brand);
      border-radius: 2px;
    }

    .navbar-toggler {
      border: none;
      padding: .35rem .5rem;
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 .2rem rgba(13, 95, 219, .25);
    }

    /* ---------- Offcanvas ---------- */
    .offcanvas {
      width: 260px;
    }

    .offcanvas-header {
      border-bottom: 1px solid #eee;
    }

    .offcanvas-title {
      font-weight: 600;
      color: var(--brand);
    }

    .offcanvas .nav-item {
      width: 100%;
    }

    .offcanvas .nav-link {
      padding: .75rem .5rem;
      border-radius: .5rem;
      color: var(--ink);
      font-weight: 500;
    }

    .offcanvas .nav-link:hover {
      background: #f1f5fb;
      color: var(--brand);
    }

    .offcanvas .nav-link.active {
      background: var(--brand);
      color: #fff;
    }

    /* ---------- Footer ---------- */
    footer a {
      color: #cfd8e3;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="/">BUSINESS</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
              aria-controls="mobileMenu" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Desktop Nav -->
      <div class="collapse navbar-collapse fs-5" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if request.path == '/service' %}active{% endif %}" href="/service">Services</a></li>
          <li class="nav-item"><a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Mobile Offcanvas Sidebar -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="mobileMenuLabel">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="navbar-nav gap-1">
        <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/service' %}active{% endif %}" href="/service">Services</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a></li>
      </ul>
    </div>
  </div>

  {% block content %}{% endblock %}

  <!-- Footer -->
  <footer class="bg-dark text-light py-3 mt-auto shadow-sm">
    <div class="container text-center">
      <div class="mb-2 gap-5 d-flex justify-content-center">
        <div>&copy; 2026 EZZY. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS bundle: loaded once, at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
