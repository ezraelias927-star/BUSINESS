{% extends 'adminbase.html' %}
{% block content %}
<body>
    <div class="container bg-light shadow mt-5 mb-5 p-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="card p-5 mt-5">
                    <div>
                        {% with messages=get_flashed_messages() %}
                        {% if messages %}
                        <div class="text-center text-danger">
                            {% for message in messages %}
                            <p>{{ message }}</p>
                            {% endfor %}
                        {% endif %}
                        {% endwith %}
                    </div>
                <form action="/add" method="POST" enctype="multipart/form-data">
                    <div class="form-label align-items-center text-center">
                    <input type="file" name="file" placeholder="pakia picha " class="form-control mb-3 mt-4 text-center">
                    <input type="text" name="bei" placeholder="bei" class="form-control pw-3 mb-3 text-center">
                    <input type="text" name="maelezo" placeholder="maelezo " class="form-control mb-3 text-center">
                    <input type="text" name="tarehe" placeholder="tarehe" class="form-control mb-3 text-center">
                    <button type="submit" class="form-control  text-center">submit</button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock %}
